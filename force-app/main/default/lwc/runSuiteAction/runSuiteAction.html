<template>
    <div class="slds-p-around_medium">

        <template if:true={isLoading}>
            <lightning-spinner alternative-text="Loading scripts..." size="medium"></lightning-spinner>
        </template>

        <template if:false={isLoading}>
            <template if:true={hasScripts}>
                <p class="slds-text-body_small slds-text-color_weak slds-m-bottom_small">
                    Select one or more scripts to run.
                </p>
                <lightning-datatable
                    key-field="Id"
                    data={scripts}
                    columns={columns}
                    selected-rows={selectedIds}
                    onrowselection={handleSelection}>
                </lightning-datatable>
                <div class="slds-grid slds-grid_align-end slds-gutters_small slds-m-top_medium">
                    <lightning-button label="Cancel"
                                      onclick={handleCancel}
                                      disabled={isRunning}>
                    </lightning-button>
                    <lightning-button label={runButtonLabel}
                                      variant="brand"
                                      icon-name="utility:play"
                                      onclick={handleRunSelected}
                                      disabled={isRunButtonDisabled}>
                    </lightning-button>
                </div>
            </template>

            <template if:false={hasScripts}>
                <div class="slds-text-align_center slds-p-around_large">
                    <p class="slds-text-color_weak">No active test scripts found for this suite.</p>
                    <lightning-button label="Close"
                                      onclick={handleCancel}
                                      class="slds-m-top_medium">
                    </lightning-button>
                </div>
            </template>
        </template>

    </div>
</template>
