<template>
    <div class="slds-p-around_medium">

        <!-- Confirmation / running state -->
        <template if:false={isDone}>
            <template if:true={isLoadingRecord}>
                <lightning-spinner alternative-text="Loading..." size="small"></lightning-spinner>
            </template>
            <template if:false={isLoadingRecord}>
                <p class="slds-text-body_regular slds-m-bottom_x-small">
                    Queue a new test run for:
                </p>
                <p class="slds-text-heading_small slds-m-bottom_large">
                    <strong>{scriptName}</strong>
                </p>
                <div class="slds-grid slds-grid_align-end slds-gutters_small">
                    <lightning-button label="Cancel"
                                      onclick={handleCancel}
                                      disabled={isRunning}>
                    </lightning-button>
                    <lightning-button label={runLabel}
                                      variant="brand"
                                      icon-name="utility:play"
                                      onclick={handleRun}
                                      disabled={isRunning}>
                    </lightning-button>
                </div>
            </template>
        </template>

        <!-- Result state -->
        <template if:true={isDone}>
            <div class="slds-text-align_center slds-p-around_medium">
                <lightning-icon icon-name={resultIcon} size="large"></lightning-icon>
                <p class="slds-text-heading_small slds-m-top_medium">{resultMessage}</p>
                <lightning-button label="Close"
                                  class="slds-m-top_medium"
                                  onclick={handleCancel}>
                </lightning-button>
            </div>
        </template>

    </div>
</template>
