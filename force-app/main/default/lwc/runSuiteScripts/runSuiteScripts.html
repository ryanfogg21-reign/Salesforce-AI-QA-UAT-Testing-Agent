<template>
    <div class="slds-p-around_small">
        <lightning-button
            label="Run Script/s"
            variant="brand"
            icon-name="utility:play_list"
            onclick={openModal}>
        </lightning-button>
    </div>

    <template if:true={isModalOpen}>
        <section role="dialog" tabindex="-1" aria-modal="true"
                 class="slds-modal slds-fade-in-open">
            <div class="slds-modal__container">

                <header class="slds-modal__header">
                    <button class="slds-button slds-button_icon slds-modal__close slds-button_icon-inverse"
                            title="Close" onclick={closeModal}>
                        <lightning-icon icon-name="utility:close" size="small"
                                        alternative-text="Close"></lightning-icon>
                    </button>
                    <h2 class="slds-modal__title slds-hyphenate">Select Scripts to Run</h2>
                </header>

                <div class="slds-modal__content slds-p-around_medium" style="min-height: 200px;">
                    <template if:true={isLoading}>
                        <lightning-spinner alternative-text="Loading scripts..."
                                           size="medium"></lightning-spinner>
                    </template>
                    <template if:false={isLoading}>
                        <template if:true={hasScripts}>
                            <lightning-datatable
                                key-field="Id"
                                data={scripts}
                                columns={columns}
                                selected-rows={selectedIds}
                                onrowselection={handleSelection}>
                            </lightning-datatable>
                        </template>
                        <template if:false={hasScripts}>
                            <div class="slds-illustration slds-illustration_small slds-p-around_large">
                                <p class="slds-text-color_weak">No active test scripts found for this suite.</p>
                            </div>
                        </template>
                    </template>
                </div>

                <footer class="slds-modal__footer">
                    <lightning-button label="Cancel" onclick={closeModal}></lightning-button>
                    <lightning-button
                        label={runButtonLabel}
                        variant="brand"
                        icon-name="utility:play"
                        onclick={handleRunSelected}
                        disabled={isRunButtonDisabled}
                        class="slds-m-left_small">
                    </lightning-button>
                </footer>

            </div>
        </section>
        <div class="slds-backdrop slds-backdrop_open"></div>
    </template>
</template>
